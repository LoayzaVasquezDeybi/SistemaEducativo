<div class="sec-title">Gestión de Roles</div>
<div class="sec-sub">Configura niveles y perfiles de acceso al sistema</div>
<div class="card">
  <div class="card-title">Nuevo rol</div>
  <div class="form-row cols2">
    <div class="form-group">
      <label>Nombre del rol</label>
      <input type="text" id="rol-nombre" placeholder="Ej. Auxiliar Administrativo">
    </div>
    <div class="form-group">
      <label>Descripción</label>
      <input type="text" id="rol-descripcion" placeholder="Ej. Ayuda en el registro de asistencias">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="btn-registrar-rol">Registrar rol</button>
    <button class="btn btn-secondary" onclick="limpiarFormularioEdicionRol()">Limpiar / Cancelar</button>
  </div>
</div>
<div class="card">
  <div class="card-title">Listado de roles</div>
  <div style="margin-bottom: 15px;">
    <input type="text" id="buscar-rol" placeholder="🔍 Buscar rol..." style="width: 100%; max-width: 350px; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
  </div>
  <div class="table-wrap">
    <table id="tabla-roles">
      <thead><tr><th style="width:50px;">ID</th><th>Nombre del Rol</th><th>Descripción</th><th>Acciones</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>
<script>
  if (typeof inicializarRoles === 'function') inicializarRoles();
</script>
