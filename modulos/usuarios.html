<div class="sec-title">Gestión de Usuarios</div>
<div class="sec-sub">Registro y administración de cuentas del sistema</div>
<div class="card">
  <div class="card-title">Nuevo usuario</div>
  <div class="form-row cols3">
    <div class="form-group"><label>Nombre</label><input type="text" id="user-nombre" placeholder="Juan"></div>
    <div class="form-group"><label>Apellido</label><input type="text" id="user-apellido" placeholder="Pérez"></div>
    <div class="form-group"><label>DNI</label><input type="text" id="user-dni" placeholder="12345678"></div>
  </div>
  <div class="form-row cols3">
    <div class="form-group"><label>Email</label><input type="email" id="user-email" placeholder="usuario@ie.edu.pe"></div>
    <div class="form-group"><label>Contraseña</label><input type="password" id="user-pass" placeholder="••••••••"></div>
    <div class="form-group">
    <label>Rol</label>
    <select id="user-rol">
        <option value="1">Administrador</option>
        <option value="2">Docente</option>
        <option value="3">Estudiante</option>
    </select>
</div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="btn-registrar-usuario">Registrar usuario</button>
    <button class="btn btn-secondary" onclick="limpiarFormularioEdicion()">Limpiar / Cancelar</button>
    <button class="btn btn-secondary" id="btn-exportar-usuarios-pdf"><i class="fas fa-file-pdf"></i> Exportar PDF</button>
    <button class="btn btn-secondary" id="btn-exportar-usuarios-excel"><i class="fas fa-file-excel"></i> Exportar Excel</button>
  </div>
</div>
<div class="card">
  <div class="card-title">Listado de usuarios</div>
  <div style="margin-bottom: 15px;">
    <input type="text" id="buscar-usuario" placeholder="🔍 Buscar usuario por nombre, DNI o rol..." style="width: 100%; max-width: 350px; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
  </div>
  <div class="table-wrap">
    <table id="tabla-usuarios">
      <thead><tr><th>Nombre</th><th>DNI</th><th>Email</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>
<script>
  if (typeof inicializarUsuarios === 'function') {
    inicializarUsuarios();
  }
</script>
