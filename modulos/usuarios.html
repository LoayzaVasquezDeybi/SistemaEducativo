<div class="sec-title">Gestión de Usuarios</div>
<div class="sec-sub">Registro y administración de cuentas del sistema</div>
<div class="card">
  <div class="card-title">Nuevo usuario</div>
  <div class="form-row cols3">
    <div class="form-group"><label>Nombre</label><input type="text" placeholder="Juan"></div>
    <div class="form-group"><label>Apellido</label><input type="text" placeholder="Pérez"></div>
    <div class="form-group"><label>DNI</label><input type="text" placeholder="12345678"></div>
  </div>
  <div class="form-row cols3">
    <div class="form-group"><label>Email</label><input type="email" placeholder="usuario@ie.edu.pe"></div>
    <div class="form-group"><label>Contraseña</label><input type="password" placeholder="••••••••"></div>
    <div class="form-group">
    <label>Rol</label>
    <select>
        <option value="1">Administrador</option>
        <option value="2">Docente</option>
        <option value="3">Auxiliar</option>
    </select>
</div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="btn-registrar-usuario">Registrar usuario</button>
    <button class="btn btn-secondary" onclick="limpiarFormularioEdicion()">Limpiar / Cancelar</button>
</div>
<div class="card">
  <div class="card-title">Listado de usuarios</div>
  <div class="table-wrap">
    <table id="tabla-usuarios">
      <thead><tr><th>Nombre</th><th>DNI</th><th>Email</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>
<script>
  if (typeof inicializarUsuarios === 'function') {
    inicializarUsuarios();
  }
</script>
