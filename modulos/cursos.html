<div class="sec-title">Gestión de Cursos</div>
<div class="sec-sub">Registro y configuración de cursos académicos</div>
<div class="card">
  <div class="card-title">Nuevo curso</div>
  <div class="form-row cols3">
    <div class="form-group"><label>Nombre del curso</label><input type="text" id="curso-nombre" placeholder="Ej. Matemáticas"></div>
    <div class="form-group"><label>Descripción</label><input type="text" id="curso-descripcion" placeholder="Opcional: Detalles del curso"></div>
    <div class="form-group"><label>Créditos</label><input type="number" id="curso-creditos" placeholder="4"></div>
  </div>
  <div class="form-row cols3">
    <div class="form-group"><label>Docente asignado</label><select id="curso-docente"><option value="">Sin asignar</option></select></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="btn-registrar-curso">Registrar curso</button>
    <button class="btn btn-secondary" onclick="limpiarFormularioEdicionCurso()">Limpiar / Cancelar</button>
  </div>
</div>
<div class="card">
  <div class="card-title">Listado de cursos</div>
  <div class="btn-row" style="justify-content: flex-end; margin-bottom: 15px;">
    <button id="btn-exportar-cursos-pdf" class="btn btn-secondary"><i class="fas fa-file-pdf"></i> Exportar a PDF</button>
    <button id="btn-exportar-cursos-excel" class="btn btn-secondary"><i class="fas fa-file-excel"></i> Exportar a Excel</button>
  </div>
  <div class="table-wrap">
    <table id="tabla-cursos">
      <thead><tr><th>Nombre</th><th>Descripción</th><th>Créditos</th><th>Docente</th><th>Estado</th><th>Acciones</th></tr></thead>
      <tbody>
      </tbody>
    </table>
  </div>
</div>
<script>
  if (typeof inicializarCursos === 'function') {
    inicializarCursos();
  }
</script>
