<div>
    <div class="ficha-header" style="justify-content: space-between;">
        <div>
            <h2 class="sec-title">Periodos Académicos</h2>
            <p class="sec-sub">Administra los años escolares, fechas de inicio y cierre institucionales.</p>
        </div>
        <button class="btn btn-primary" onclick="mostrarFormularioPeriodo()">+ Nuevo Periodo</button>
    </div>

    <!-- Vista de Lista -->
    <div id="vista-lista-periodos" class="card">
        <div class="table-wrap">
            <table id="tabla-periodos">
                <thead>
                    <tr>
                        <th>Año</th>
                        <th>Nombre del Periodo</th>
                        <th>Fecha Inicio</th>
                        <th>Fecha Fin</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Llenado dinámico -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Vista de Formulario -->
    <div id="vista-form-periodos" class="card" style="display:none;">
        <h3 class="card-title" id="titulo-form-periodo">Registrar Nuevo Periodo</h3>
        <form id="form-periodo" onsubmit="event.preventDefault(); guardarPeriodo();">
            <input type="hidden" id="periodo_id">
            <div class="form-row cols3">
                <div class="form-group"><label>Año</label><input type="number" id="periodo_anio" required></div>
                <div class="form-group" style="grid-column: span 2;"><label>Nombre del Periodo</label><input type="text" id="periodo_nombre" required></div>
            </div>
            <div class="form-row cols3">
                <div class="form-group"><label>Fecha Inicio</label><input type="date" id="periodo_inicio" required></div>
                <div class="form-group"><label>Fecha Fin</label><input type="date" id="periodo_fin" required></div>
                <div class="form-group"><label>Estado</label><select id="periodo_estado" required><option value="acti">Activo</option><option value="inac">Inactivo</option></select></div>
            </div>
            <div class="btn-row" style="margin-top: 15px;">
                <button type="submit" class="btn btn-primary">Guardar Registro</button>
                <button type="button" class="btn btn-secondary" onclick="ocultarFormularioPeriodo()">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<script>
  if (typeof inicializarPeriodos === 'function') {
    inicializarPeriodos();
  }
</script>
