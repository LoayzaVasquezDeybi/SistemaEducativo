<div class="sec-title">Gestión de Estudiantes</div>
<div class="sec-sub">Registro, modificación y consulta de estudiantes</div>

<div class="card" id="card-form-estudiante">
  <div class="card-title">Registrar / Editar Estudiante</div>
  <input type="hidden" id="est-id">
  <div class="form-row cols3">
    <div class="form-group"><label>Código</label><input type="text" id="est-codigo" placeholder="Ej: EST-2024-001"></div>
    <div class="form-group"><label>Nombres</label><input type="text" id="est-nombre"></div>
    <div class="form-group"><label>Apellidos</label><input type="text" id="est-apellido"></div>
  </div>
  <div class="form-row cols3">
    <div class="form-group"><label>DNI</label><input type="text" id="est-dni" maxlength="8"></div>
    <div class="form-group"><label>Fecha Nacimiento</label><input type="date" id="est-fecha-nac"></div>
    <div class="form-group"><label>Estado</label>
      <select id="est-estado">
        <option value="activo">Activo</option>
        <option value="inactivo">Inactivo</option>
        <option value="preinscrito">Preinscrito</option>
        <option value="pendiente_pago">Pendiente de Pago</option>
        <option value="retirado">Retirado</option>
      </select>
    </div>
  </div>
  <div class="form-row cols2">
    <div class="form-group"><label>Grado</label><select id="est-grado"></select></div>
    <div class="form-group"><label>Sección</label><select id="est-seccion"></select></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="guardarEstudiante()">Guardar Estudiante</button>
    <button class="btn btn-secondary" onclick="limpiarFormularioEstudiante()">Limpiar / Cancelar</button>
    <button id="btn-exportar-estudiantes-pdf" class="btn btn-secondary"><i class="fas fa-file-pdf"></i> Exportar PDF</button>
  </div>
</div>

<div class="card">
  <div class="card-title">Listado de Estudiantes</div>
  <div class="table-wrap">
    <table id="tabla-estudiantes">
      <thead><tr><th>Código</th><th>Apellidos y Nombres</th><th>DNI</th><th>Grado - Sección</th><th>Estado</th><th>Acciones</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>
