<div class="sec-title">Gestión de Estudiantes</div>
<div class="sec-sub">Registro y seguimiento de alumnos matriculados</div>
<div class="card">
  <div class="card-title">Nuevo estudiante</div>
  <div class="form-row cols3">
    <div class="form-group"><label>Código</label><input type="text" placeholder="EST-2026-001"></div>
    <div class="form-group"><label>Nombres</label><input type="text" placeholder="Ana Lucía"></div>
    <div class="form-group"><label>Apellidos</label><input type="text" placeholder="García Ríos"></div>
  </div>
  <div class="form-row cols3">
    <div class="form-group"><label>DNI</label><input type="text" placeholder="74123456"></div>
    <div class="form-group"><label>Fecha de nacimiento</label><input type="date"></div>
    <div class="form-group"><label>Grado / Sección</label><select></select></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary" id="btn-registrar-estudiante">Registrar estudiante</button><button class="btn btn-secondary" onclick="limpiarFormulario(this)">Limpiar</button></div>
</div>
<div class="card">
  <div class="card-title">Listado de estudiantes</div>
  <div class="table-wrap">
    <table id="tabla-estudiantes">
      <thead><tr><th>Código</th><th>Nombre completo</th><th>DNI</th><th>Grado</th><th>Estado</th><th>Acciones</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>
<script>
  if (typeof inicializarEstudiantes === 'function') {
    inicializarEstudiantes();
  }
</script>
