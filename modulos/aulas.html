<div class="sec-title">Gestión de Aulas</div>
<div class="sec-sub">Registro y estado de aulas disponibles</div>
<div class="card">
  <div class="card-title">Nueva aula</div>
  <div class="form-row cols3">
    <div class="form-group"><label>Nombre / Número</label><input type="text" placeholder="Aula 101"></div>
    <div class="form-group"><label>Ubicación</label><input type="text" placeholder="Pabellón A – 1er piso"></div>
    <div class="form-group"><label>Capacidad</label><input type="number" placeholder="35"></div>
  </div>
  <div class="form-row cols2">
    <div class="form-group"><label>Tipo</label><select><option>Aula regular</option><option>Laboratorio</option><option>Biblioteca</option></select></div>
    <div class="form-group"><label>Estado</label><select><option>Disponible</option><option>En uso</option><option>Mantenimiento</option></select></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary">Registrar aula</button></div>
</div>
<div class="card">
  <div class="card-title">Listado de aulas</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Aula</th><th>Ubicación</th><th>Capacidad</th><th>Tipo</th><th>Estado</th></tr></thead>
      <tbody>
        <tr><td>Aula 101</td><td>Pab. A – 1er piso</td><td>35</td><td>Regular</td><td><span class="tag tag-green">Disponible</span></td></tr>
        <tr><td>Aula 201</td><td>Pab. B – 2do piso</td><td>30</td><td>Regular</td><td><span class="tag tag-amber">En uso</span></td></tr>
        <tr><td>Lab. Cómputo</td><td>Pab. C – 1er piso</td><td>20</td><td>Laboratorio</td><td><span class="tag tag-red">Mantenimiento</span></td></tr>
      </tbody>
    </table>
  </div>
</div>
