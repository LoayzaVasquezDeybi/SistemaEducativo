<div class="sec-title">Registro de Incidencias</div>
<div class="sec-sub">Ingreso, modificación y reporte de incidencias disciplinarias y académicas</div>

<div class="card" id="card-form-incidencia">
  <div class="card-title">Nueva incidencia</div>
  <input type="hidden" id="incidencia-id">
  <div class="form-row cols3">
    <div class="form-group"><label>Fecha</label><input type="date" id="incidencia-fecha"></div>
    <div class="form-group"><label>Estudiante</label><select id="incidencia-estudiante"></select></div>
    <div class="form-group"><label>Tipo de Incidencia</label><select id="incidencia-tipo"></select></div>
  </div>
  <div class="form-row cols2">
    <div class="form-group"><label>Descripción</label><textarea id="incidencia-descripcion" rows="2" placeholder="Describa brevemente lo ocurrido"></textarea></div>
    <div class="form-group"><label>Acción Tomada</label><textarea id="incidencia-accion" rows="2" placeholder="Ej: Se llamó al apoderado, se derivó a psicología..."></textarea></div>
  </div>
  <div class="form-row">
    <div class="form-group"><label>Reportado por (Docente)</label><select id="incidencia-docente"><option value="">Sistema / Auxiliar</option></select></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="guardarIncidencia()">Guardar incidencia</button>
    <button class="btn btn-secondary" onclick="limpiarFormularioIncidencia()">Limpiar / Cancelar</button>
    <button id="btn-exportar-incidencias-pdf" class="btn btn-secondary"><i class="fas fa-file-pdf"></i> Exportar PDF</button>
  </div>
</div>

<div class="card">
  <div class="card-title">Listado de incidencias</div>
  <div class="table-wrap">
    <table id="tabla-incidencias">
      <thead><tr><th>Fecha</th><th>Estudiante</th><th>Tipo</th><th>Descripción</th><th>Acción Tomada</th><th>Reportado por</th><th>Acciones</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>
