<div>
    <div class="ficha-header" style="justify-content: space-between;">
        <div>
            <h2 class="sec-title">Gestión de Vacantes</h2>
            <p class="sec-sub">Administra la disponibilidad de cupos y secciones para el periodo escolar.</p>
        </div>
        <button class="btn btn-primary" onclick="mostrarFormularioVacante()">+ Nueva Vacante</button>
    </div>

    <!-- Vista de Lista -->
    <div id="vista-lista-vacantes" class="card">
        <div class="table-wrap">
            <table id="tabla-vacantes">
                <thead>
                    <tr>
                        <th>ID Vacante</th>
                        <th>Periodo</th>
                        <th>Grado</th>
                        <th>Sección</th>
                        <th>Total Vacantes</th>
                        <th>Disponibles</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Llenado dinámico -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Vista de Formulario -->
    <div id="vista-form-vacantes" class="card" style="display:none;">
        <h3 class="card-title" id="titulo-form-vacante">Registrar Nueva Vacante</h3>
        <form id="form-vacante" onsubmit="event.preventDefault(); guardarVacante();">
            <input type="hidden" id="vacante_id">
            <div class="form-row cols3">
                <div class="form-group">
                    <label>Periodo</label>
                    <select id="vacante_periodo" required></select>
                </div>
                <div class="form-group">
                    <label>Grado</label>
                    <select id="vacante_grado" required></select>
                </div>
                <div class="form-group">
                    <label>Sección</label>
                    <select id="vacante_seccion" required></select>
                </div>
            </div>
            <div class="form-row cols2">
                <div class="form-group">
                    <label>Total Vacantes</label>
                    <input type="number" id="vacante_total" required min="0">
                </div>
                <div class="form-group">
                    <label>Vacantes Disponibles</label>
                    <input type="number" id="vacante_disponibles" required min="0">
                </div>
            </div>
            <div class="btn-row" style="margin-top: 15px;">
                <button type="submit" class="btn btn-primary">Guardar Registro</button>
                <button type="button" class="btn btn-secondary" onclick="ocultarFormularioVacante()">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<script>
  if (typeof inicializarVacantes === 'function') {
    inicializarVacantes();
  }
</script>
