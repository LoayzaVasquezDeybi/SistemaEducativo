<div class="sec-title">Gestion de Docentes</div>
<div class="sec-sub">Registro y asignacion de cursos a docentes</div>

<div class="card">
  <div class="card-title">Nuevo docente</div>
  <div class="form-row cols3">
    <div class="form-group"><label>Nombres</label><input type="text" id="doc-nombre" placeholder="Luis Alberto"></div>
    <div class="form-group"><label>Apellidos</label><input type="text" id="doc-apellido" placeholder="Torres Vega"></div>
    <div class="form-group"><label>DNI</label><input type="text" id="doc-dni" placeholder="20123456"></div>
  </div>
  <div class="form-row cols3">
    <div class="form-group"><label>Email</label><input type="email" id="doc-email" placeholder="docente@escuela.com"></div>
    <div class="form-group"><label>Especialidad</label><input type="text" id="doc-especialidad" placeholder="Matematicas"></div>
    <div class="form-group">
      <label>Curso asignado</label>
      <select id="doc-curso"><option value="">Cargando cursos...</option></select>
    </div>
  </div>
  <div class="btn-row">
    <button id="btn-registrar-docente" class="btn btn-primary">Registrar docente</button>
    <button class="btn btn-secondary" onclick="limpiarFormularioDocente()">Limpiar / Cancelar</button>
    <button class="btn btn-secondary" id="btn-exportar-docentes-pdf">Exportar PDF</button>
  </div>
</div>

<div class="card">
  <div class="card-title">Listado de docentes</div>
  <div style="margin-bottom: 15px;">
    <input type="text" id="buscar-docente" placeholder="Buscar docente por nombre, DNI, especialidad o curso..." style="width: 100%; max-width: 350px; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
  </div>
  <div class="table-wrap">
    <table id="tabla-docentes">
      <thead>
        <tr><th>Nombre</th><th>DNI</th><th>Email</th><th>Especialidad</th><th>Curso asignado</th><th>Estado</th><th>Acciones</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
  if (typeof inicializarDocentes === 'function') {
    inicializarDocentes();
  }
</script>
