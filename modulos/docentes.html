<div class="sec-title">Gestión de Docentes</div>
<div class="sec-sub">Registro y asignación de cursos a docentes</div>
<div class="card">
  <div class="card-title">Nuevo docente</div>
  <div class="form-row cols3">
    <div class="form-group"><label>Nombres</label><input type="text" placeholder="Luis Alberto"></div>
    <div class="form-group"><label>Apellidos</label><input type="text" placeholder="Torres Vega"></div>
    <div class="form-group"><label>DNI</label><input type="text" placeholder="20123456"></div>
  </div>
  <div class="form-row cols3">
    <div class="form-group"><label>Especialidad</label><input type="text" placeholder="Matemáticas"></div>
    <div class="form-group"><label>Teléfono</label><input type="text" placeholder="987654321"></div>
    <div class="form-group"><label>Curso asignado</label><select><option>Matemáticas</option><option>Comunicación</option><option>Ciencias</option><option>Historia</option></select></div>
  </div>
  <div class="btn-row"><button class="btn btn-primary">Registrar docente</button></div>
</div>
<div class="card">
  <div class="card-title">Listado de docentes</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Nombre</th><th>DNI</th><th>Especialidad</th><th>Cursos</th><th>Estado</th></tr></thead>
      <tbody>
        <tr><td>Luis Torres</td><td>20123456</td><td>Matemáticas</td><td>3</td><td><span class="tag tag-green">Activo</span></td></tr>
        <tr><td>Rosa Quispe</td><td>21234567</td><td>Comunicación</td><td>4</td><td><span class="tag tag-green">Activo</span></td></tr>
        <tr><td>Pedro Salcedo</td><td>22345678</td><td>Ciencias</td><td>2</td><td><span class="tag tag-green">Activo</span></td></tr>
      </tbody>
    </table>
  </div>
</div>
