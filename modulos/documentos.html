<div class="sec-title">Gestion de Documentos</div>
<div class="sec-sub">Carga y descarga de documentos academicos</div>

<div class="card">
  <div class="card-title">Subir documento</div>
  <form id="form-documento">
    <div class="form-row cols3">
      <div class="form-group"><label>Archivo</label><input type="file" id="doc-archivo" required></div>
      <div class="form-group"><label>Tipo</label><select id="doc-tipo"></select></div>
      <div class="form-group"><label>Usuario responsable</label><select id="doc-usuario"></select></div>
    </div>
    <div class="form-row cols3">
      <div class="form-group"><label>Estudiante relacionado</label><select id="doc-estudiante"></select></div>
    </div>
    <div class="btn-row"><button class="btn btn-primary" type="submit">Subir documento</button></div>
  </form>
</div>

<div class="card">
  <div class="card-title">Documentos registrados</div>
  <div class="table-wrap">
    <table id="tabla-documentos">
      <thead><tr><th>Nombre</th><th>Tipo</th><th>Usuario</th><th>Estudiante</th><th>Fecha</th><th>Acciones</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
  if (typeof inicializarDocumentos === 'function') inicializarDocumentos();
</script>
